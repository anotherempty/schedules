name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux / ${{ matrix.features.name }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.91.0'
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
            args: ''
          - name: all
            args: '--all-features'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: linux-${{ env.RUSTUP_TOOLCHAIN }}-${{ matrix.features.name }}
      - name: Test
        run: cargo test --workspace --locked ${{ matrix.features.args }}
      - name: Clippy
        if: matrix.features.name == 'all'
        run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings
      - name: Documentation
        if: matrix.features.name == 'all'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked --all-features
