name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }} / ${{ matrix.features.name }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, '1.91.0']
        features:
          - name: default
            args: ''
          - name: ics
            args: '--features schedules-core/ics'
          - name: calendar-views
            args: '--features schedules-core/calendar-views'
          - name: all
            args: '--all-features'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy
      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.features.name }}
      - name: Test
        run: cargo +${{ matrix.rust }} test --workspace --locked ${{ matrix.features.args }}
      - name: Clippy
        run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --locked ${{ matrix.features.args }} -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.rust }} doc --workspace --no-deps --locked ${{ matrix.features.args }}
