name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Verify tag matches workspace versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/check-release-tag.py "$RELEASE_TAG"

  validate:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify tag matches workspace versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/check-release-tag.py "$RELEASE_TAG"
      - name: Cache Cargo dependencies and tools
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: release
      - name: Install cargo-release
        run: cargo install cargo-release --version 1.1.7 --locked
      - name: Publish tagged versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Set the CARGO_REGISTRY_TOKEN repository secret before publishing.'
            exit 1
          fi
          cargo release publish --workspace --allow-branch HEAD --execute --no-confirm
