[workspace]
members = ["crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
thiserror = "2"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
